[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-connectors"
version = "0.15.1"
description = "HTTP client, GCS path contract, MCP server core, DuckDB connectors, and testing utilities for DataCivicLab"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{name = "DataCivicLab"}]

dependencies = [
    "requests>=2.31.0",
    "urllib3>=2.0.0",
]

[project.scripts]
audit-test-markers = "lab_connectors.testing.audit_markers:main"

[project.optional-dependencies]
mcp = [
    "mcp>=1.13,<2",
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
]
gcs = [
    "google-cloud-storage>=2.19.0",
]
duckdb = [
    "duckdb>=1.5.3",
]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
    "types-requests>=2.31.0.0",
]

[tool.setuptools.packages.find]
include = ["lab_connectors", "lab_connectors.*"]
exclude = ["mcp_servers", "mcp_servers.*"]

[tool.setuptools.package-data]
"lab_connectors.gcs" = ["paths.json"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "C4", "D", "E501"]
ignore = [
    "D203", "D213",
    # Intenzionali — except Exception generico in production code
    "BLE001", "S110",
    # Script con shebang non eseguibili (.github/scripts/)
    "EXE001",
    # Scelte di design su annotazioni tipo
    "PYI034", "PYI041", "RUF012",
    # Blocco TYPE_CHECKING vuoto ma leggibile
    "TC005",
]

[tool.ruff.lint.per-file-ignores]
"lab_connectors/__init__.py" = ["D104"]
"lab_connectors/http/__init__.py" = ["D104"]
"lab_connectors/mcp/__init__.py" = ["D104"]
"lab_connectors/gcs/__init__.py" = ["D104", "RUF022"]
"lab_connectors/duckdb/__init__.py" = ["D104"]
"tests/**" = [
    "D",
    # Test usano Exception generico volutamente
    "TRY002",
    # Custom logger API con kwargs extra
    "PLE1205",
    # nested with più leggibile nei test
    "SIM117",
]
"lab_connectors/http/types.py" = ["D105"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "duckdb"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google.cloud", "google.cloud.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--timeout=30"
markers = [
    "gcs: test che richiede connettività GCS (skippato di default)",
    "policy: regola non ovvia o comportamento cross-component",
    "smoke: test che fa chiamate HTTP reali (richiede SMOKE_TESTS=1)",
    "contract: interfaccia pubblica, artifact format, contratto API",
    "regression: bug fix documentato in issue/PR",
    "adapter: adapter a servizio esterno (nostro wrapping)",
    "pure_unit: logica pura non banale isolata",
]
