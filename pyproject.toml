[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-connectors"
version = "0.1.0"
description = "Shared HTTP client and adapters for DataCivicLab"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "DataCivicLab"}]

dependencies = [
    "requests>=2.31.0",
    "urllib3>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "types-requests>=2.31.0.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "C4", "D", "E501"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"lab_connectors/__init__.py" = ["D104"]
"lab_connectors/http/__init__.py" = ["D104"]
"tests/**" = ["D"]
"lab_connectors/http/types.py" = ["D105"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
