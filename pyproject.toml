[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-connectors"
version = "0.10.0"
description = "Shared HTTP client, GCS path contract, and adapters for DataCivicLab"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{name = "DataCivicLab"}]

dependencies = [
    "requests>=2.31.0",
    "urllib3>=2.0.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
]
gcs = [
    "google-cloud-storage>=2.19.0",
]
duckdb = [
    "duckdb>=1.0.0",
]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
    "types-requests>=2.31.0.0",
]

[tool.setuptools.package-data]
"lab_connectors.gcs" = ["paths.json"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "C4", "D", "E501"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"lab_connectors/__init__.py" = ["D104"]
"lab_connectors/http/__init__.py" = ["D104"]
"lab_connectors/mcp/__init__.py" = ["D104"]
"lab_connectors/gcs/__init__.py" = ["D104"]
"lab_connectors/duckdb/__init__.py" = ["D104"]
"tests/**" = ["D"]
"lab_connectors/http/types.py" = ["D105"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "duckdb"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--timeout=30"
markers = [
    "gcs: test che richiede connettività GCS (skippato di default)",
    "policy: regola non ovvia o comportamento cross-component",
    "smoke: test che fa chiamate HTTP reali (richiede SMOKE_TESTS=1)",
    "contract: interfaccia pubblica, artifact format, contratto API",
    "regression: bug fix documentato in issue/PR",
    "adapter: adapter a servizio esterno (nostro wrapping)",
    "pure_unit: logica pura non banale isolata",
]
