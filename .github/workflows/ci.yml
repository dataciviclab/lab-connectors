name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev,mcp,duckdb]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy lab_connectors/

      - name: Pytest
        run: pytest tests/ -q
