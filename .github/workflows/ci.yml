name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          extra-packages: -e ".[dev,mcp,duckdb]" pytest-cov

      - uses: dataciviclab/.github/actions/python-ci@main
        with:
          lint_paths: "."
          mypy_paths: "lab_connectors/"
          test_dir: "tests"
          pytest_args: "-q -m \"not smoke\""
          cov_module: "lab_connectors"
          cov_report: "term"
          cov_threshold: "80"
