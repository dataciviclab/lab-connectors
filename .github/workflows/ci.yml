name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          extra-packages: -e ".[dev,mcp,duckdb]" pytest-cov

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy lab_connectors/

      - name: Pytest
        run: pytest tests/ -q -m "not smoke" --cov=lab_connectors --cov-report=term --cov-fail-under=80
