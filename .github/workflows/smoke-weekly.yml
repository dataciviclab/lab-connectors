name: Smoke Tests (weekly)

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev,mcp,duckdb]"

      - name: Run smoke test (catalog manifest GCS)
        env:
          SMOKE_TESTS: "1"
        run: pytest tests/http/test_http_real.py -v --tb=short

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });
            const existing = issues.find(i => i.title.includes("Catalog manifest smoke test failed"));
            if (existing) {
              console.log("Issue already open: #" + existing.number);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "⚠️ Catalog manifest smoke test failed",
              body: `The weekly smoke test (GET catalog/manifest.json) failed at ${new Date().toISOString()}.

            This likely means:
            - GCS bucket dataciviclab-clean is unreachable
            - The manifest.json contract has changed
            - There is a TLS or network issue

            Investigate and either fix the endpoint or update the test.

            See the workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              labels: ["smoke-failure"],
            });
